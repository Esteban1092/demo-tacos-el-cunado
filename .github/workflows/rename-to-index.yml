name: Rename demo file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new generic demo
        run: |
          git config user.name "Esteban1092"
          git config user.email "estebanjesusgonzalezflores@gmail.com"
          rm -f index.html
          mv demo-web-tacos-el-cunado.html index.html
          git add -A
          git commit -m "Replace index.html with generic Tu Taqueria version"
          git push
