name: Rename demo to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename demo file to index.html
        run: |
          git config user.name "Esteban1092"
          git config user.email "esteban1092@users.noreply.github.com"
          if [ -f index.html ]; then git rm index.html; fi
          git mv demo-web-tacos-el-cunado.html index.html
          git commit -m "Rename demo-web-tacos-el-cunado.html to index.html"
          git push
